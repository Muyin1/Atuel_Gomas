services:
  - type: web
    name: atuel-gomas
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
